# 依赖更新与漏洞提醒由 Dependabot 自动发起 PR
version: 2
updates:
  # Gradle 依赖（gradle/libs.versions.toml + build.gradle.kts）
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
